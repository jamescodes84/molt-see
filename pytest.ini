[pytest]
# Test discovery
testpaths = open_eyes/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Test categorization markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, full pipeline)
    requires_camera: Tests that need a physical camera
    requires_api: Tests that need VLM API access

# Coverage configuration
[coverage:run]
source = open_eyes/src
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
